(()=>{'use strict';const $=id=>document.getElementById(id),types=['patty','fries','drink','bun'],faces=['👩🏽','👨🏻','👩🏼','👨🏾','👩🏻'],emoji={burger:'🍔',fries:'🍟',drink:'🥤'},base={patty:5,fries:6,drink:2.5};let saved={};try{saved=JSON.parse(localStorage.getItem('kitchenRush3'))||{}}catch{}let lang=saved.lang||'en',coins=Number.isFinite(saved.coins)?saved.coins:100,level=saved.level||1,up=saved.up||{patty:0,fries:0,drink:0,bun:0};for(const t of types)up[t]=Math.max(0,Math.min(7,up[t]||0));let active=false,paused=false,sec=90,served=0,combo=0,miss=0,customers=[],selected=null,tray={patty:0,fries:0,drink:0,bun:0},stations={},id=0,spawnTime=0,last=performance.now(),audio=null;
const words={en:{goal:'Orders',serve:'🍽️ SERVE',shop:'🛠️ UPGRADES',pause:'⏸ PAUSE',resume:'▶ RESUME',counter:'SERVING COUNTER',hint:'Tap a station to cook, tap again when ready to collect.',shopTitle:'Kitchen upgrades',close:'CLOSE',start:'LET’S COOK 🔥',win:'LEVEL COMPLETE! ⭐',lose:'TIME UP!',intro:'Cook food, collect ready items, add buns and serve the matching guest!',patty:'GRILL',fries:'FRYER',drink:'DRINKS',bun:'BUNS',ready:'READY! TAP',burnt:'BURNT! CLEAR',cooking:'COOKING',tap:'TAP TO COOK',add:'ADD BUN',empty:'Prepare the selected order first!',bought:'Upgrade purchased!',full:'Tray is full!',notEnough:'Not enough coins!',max:'MAX'},ru:{goal:'Заказы',serve:'🍽️ ВЫДАТЬ',shop:'🛠️ УЛУЧШЕНИЯ',pause:'⏸ ПАУЗА',resume:'▶ ПРОДОЛЖИТЬ',counter:'СТОЙКА ВЫДАЧИ',hint:'Нажми на станцию, чтобы готовить, и ещё раз, чтобы забрать.',shopTitle:'Улучшения кухни',close:'ЗАКРЫТЬ',start:'НАЧАТЬ 🔥',win:'УРОВЕНЬ ПРОЙДЕН! ⭐',lose:'ВРЕМЯ ВЫШЛО!',intro:'Готовь еду, забирай готовое, добавляй булочки и обслуживай гостей!',patty:'ГРИЛЬ',fries:'ФРИТЮР',drink:'НАПИТКИ',bun:'БУЛОЧКИ',ready:'ГОТОВО! ЗАБРАТЬ',burnt:'СГОРЕЛО! УБРАТЬ',cooking:'ГОТОВИТСЯ',tap:'НАЧАТЬ ГОТОВИТЬ',add:'ДОБАВИТЬ БУЛОЧКУ',empty:'Сначала приготовь выбранный заказ!',bought:'Улучшение куплено!',full:'Поднос заполнен!',notEnough:'Недостаточно монет!',max:'МАКСИМУМ'}};const t=k=>words[lang][k],save=()=>{try{localStorage.setItem('kitchenRush3',JSON.stringify({coins,level,up,lang}))}catch{}},goal=()=>Math.min(14,4+Math.ceil(level/2)),duration=n=>base[n]*Math.pow(.82,up[n]),cost=n=>Math.round(60*Math.pow(1.65,up[n]));function beep(f=600){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.start();o.stop(audio.currentTime+.1)}catch{}}let toastTimer;function toast(s){$('toast').textContent 'goal').textContent=t('goal')+': '+served+'/'+goal();$('combo').textContent=combo>1?'🔥 COMBO ×'+combo:'';$('counterTitle').textContent=t('counter');$('hint').textContent=t('hint');$('tray').textContent=items().map(x=>emoji[x]).join(' ')||'🍽️';$('serve').textContent=t('serve');$('shopButton').textContent=t('shop');$('pause').textContent=paused?t('resume'):t('pause');$('shopTitle').textContent=t('shopTitle');$('closeShop').textContent=t('close');for(const n of types){$(n+'Name').textContent=t(n);const b=document.querySelector('[data-kind="'+n+'"]'),s=stations[n];b.classList.toggle('ready',s?.mode==='ready');b.classList.toggle('burnt',s?.mode==='burnt');$(n+'State').textContent=n==='bun'?t('add'):s.mode==='idle'?t('tap'):s.mode==='cooking'?t('cooking')+' '+Math.ceil(duration(n)-s.time)+'s':s.mode==='ready'?t('ready'):t('burnt')}const root=$('customers');root.innerHTML='';for(const c of customers){const el=document.createElement('div');el.className='guest'+(selected===c.id?' active':'');el.innerHTML='<div class="order">'+c.items.map(x=>emoji[x]).join(' ')+'</div><div class="face">'+c.face+'</div><div class="bar"><i style="width:'+Math.max(0,c.patience/c.max*100)+'%"></i></div>';el.onclick=()=>{selected=c.id;render()};root.appendChild(el)}if(!$('shop').hidden)shop()}$('start').onclick=reset;$('serve').onclick=serve;$('pause').onclick=()=>{if(!active||!$('shop').hidden)return;paused=!paused;render()};$('shopButton').onclick=()=>{if(!active)return;paused=true;$('shop').hidden=false;render()};$('closeShop').onclick=()=>{$('shop').hidden=true;paused=false;render()};$('lang').onclick=()=>{lang=lang==='en'?'ru':'en';save();render();if(!active){$('modalTitle').textContent='Burger Boulevard 🍔';$('modalText').textContent=t('intro');$('start').textContent=t('start')}};document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>station(b.dataset.kind));document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='1')station('patty');if(e.key==='2')station('fries');if(e.key==='3')station('drink');if(e.key==='4')station('bun');if(e.key==='Enter')serve()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;render()}});stations={patty:{mode:'idle',time:0},fries:{mode:'idle',time:0},drink:{mode:'idle',time:0}};render();function frame(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;tick(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
