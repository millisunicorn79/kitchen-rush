'Готовь еду, забирай готовое, добавляй булочки и обслуживай гостей!',patty:'ГРИЛЬ',fries:'ФРИТЮР',drink:'НАПИТКИ',bun:'БУЛОЧКИ',ready:'ГОТОВО! ЗАБРАТЬ',burnt:'СГОРЕЛО! УБРАТЬ',cooking:'ГОТОВИТСЯ',tap:'НАЧАТЬ ГОТОВИТЬ',add:'ДОБАВИТЬ БУЛОЧКУ',empty:'Сначала приготовь выбранный заказ!',bought:'Улучшение куплено!',full:'Поднос заполнен!',notEnough:'Недостаточно монет!',max:'МАКСИМУМ'}};const t=k=>words[lang][k],save=()=>{try{localStorage.setItem('kitchenRush3',JSON.stringify({coins,level,up,lang}))}catch{}},goal=()=>Math.min(14,4+Math.ceil(level/2)),duration=n=>base[n]*Math.pow(.82,up[n]),cost=n=>Math.round(60*Math.pow(1.65,up[n]));function beep(f=600){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.start();o.stop(audio.currentTime+.1)}catch{}}let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1400)}function order(){let pool=level<3?['burger','fries','drink']:['burger','fries','drink','burger+fries','burger+drink','fries+drink'];return pool[Math.floor(Math.random()*pool.length)].split('+')}function addGuest(){if(customers.length>=3)return;const guest={id:++id,face:faces[Math.floor(Math.random()*faces.length)],items:order(),patience:Math.max(17,37-level*.4),max:Math.max(17,37-level*.4)};customers.push(guest);if(selected===null)selected=guest.id}let tutorialStage=0;function tutorialText(){if(level!==1||tutorialStage>=4)return t('hint');const steps=lang==='ru'?['ШАГ 1/4: Нажми на станцию нужного блюда, чтобы начать готовку.','ШАГ 2/4: Следи за таймером и нажми ещё раз, когда появится «ГОТОВО».','ШАГ 3/4: Для бургера добавь булочку. Еда появится на стойке.','ШАГ 4/4: Нажми на гостя с подходящим заказом или кнопку «ВЫДАТЬ».']:['STEP 1/4: Tap a station to start cooking.','STEP 2/4: Watch the countdown and tap again when READY appears.','STEP 3/4: For burgers, add a bun. Food appears on the counter.','STEP 4/4: Tap the matching customer or press SERVE.'];return steps[tutorialStage]}function reset(){tutorialStage=level===1?0:4;active=true;paused=false;sec=90;served=0;combo=0;miss=0;customers=[];selected=null;tray={patty:0,fries:0,drink:0,bun:0};stations={patty:{mode:'idle',time:0},fries:{mode:'idle',time:0},drink:{mode:'idle',time:0}};spawnTime=0;addGuest();addGuest();$('overlay').hidden=true;$('shop').hidden=true;last=performance.now();render()}function capacity(n){return n==='patty'||n==='fries'?Math.min(3,1+Math.floor((up[n]+1)/3)):1}function slots(n){return stations[n].slots||(stations[n].slots=[{mode:'idle',time:0}])}function celebrate(kind){const el=document.createElement('div');el.className='kitchen-float';el.textContent=kind==='serve'?'✨ +🪙':kind==='ready'?(lang==='ru'?'✓ ГОТОВО!':'✓ READY!'):'✨';document.body.appendChild(el);setTimeout(()=>el.remove(),850)}function station(n){if(!active||paused)return;if(n==='bun'){if(tray.bun>=3)return toast(t('full'));tray.bun++;tutorialStage=Math.max(tutorialStage,3);beep(500);render();return}const arr=slots(n);let s=arr.find(x=>x.mode==='ready');if(s){if(tray[n]>=3)return toast(t('full'));tray[n]++;s.mode='idle';s.time=0;beep(740);tutorialStage=Math.max(tutorialStage,2);celebrate('collect')}else if((s=arr.find(x=>x.mode==='burnt'))){s.mode='idle';s.time=0;beep(180)}else if((s=arr.find(x=>x.mode==='idle'))){s.mode='cooking';s.time=0;tutorialStage=Math.max(tutorialStage,1);beep(360)}else if(arr.length<capacity(n)){arr.push({mode:'cooking',time:0});tutorialStage=Math.max(tutorialStage,1);beep(360)}else{toast(lang==='ru'?'Все места заняты!':'All cooking slots busy!')}render()}function items(){const a=[];for(let i=0;i<Math.min(tray.patty,tray.bun);i++)a.push('burger');for(let i=0;i<tray.fries;i++)a.push('fries');for(let i=0;i<tray.drink;i++)a.push('drink');return a}function trayView(){const burgers=Math.min(tray.patty,tray.bun),parts=[];for(let i=0;i<burgers;i++)parts.push('<span class="dish assembled" title="Burger"><span class="bun-top">✦ ✦</span><span class="lettuce"></span><span class="meat"></span><span class="bun-bottom"></span></span>');for(let i=0;i<tray.patty-burgers;i++)parts.push('<span class="dish loose" title="Patty">🥩</span>');for(let i=0;i<tray.bun-burgers;i++)parts.push('<span class="dish loose" title="Bun">🥯</span>');for(let i=0;i<tray.fries;i++)parts.push('<span class="dish loose" title="Fries">🍟</span>');for(let i=0;i<tray.drink;i++)parts.push('<span class="dish loose" title="Drink">🥤</span>');return parts.join('')||'<span class="empty-tray">🍽️</span>'}function serve(){if(!active||paused)return;const c=customers.find(x=>x.id===selected);if(!c)return toast(t('empty'));const available=items();const needed=[...c.items];if(!needed.every(x=>{const i=available.indexOf(x);if(i<0)return false;available.splice(i,1);return true}))return toast(t('empty'));for(const x of c.items){if(x==='burger'){tray.patty--;tray.bun--}else tray[x]--}coins+=Math.round(20+c.patience/c.max*15+Math.min(combo,5)*3);combo++;served++;tutorialStage=4;customers=customers.filter(x=>x.id!==c.id);selected=customers[0]?.id??null;beep(850);celebrate('serve');save();if(served>=goal())return finish(true);addGuest();render()}function finish(win){active=false;const completedGoal=goal();const stars=win?(miss===0&&sec>20?3:miss<3?2:1):0;if(win){coins+=stars*35;level=Math.min(50,level+1)}save();$('modalTitle').textContent=t(win?'win':'lose');$('modalText').textContent=t('goal')+': '+served+'/'+completedGoal+' · ⭐ '+stars+' · 🪙 '+coins;$('start').textContent=win?'NEXT LEVEL ➜':t('start');$('overlay').hidden=false;beep(win?950:180);render()}function tick(dt){if(!active||paused)return;sec-=dt;if(sec<=0){sec=0;finish(false);return}spawnTime+=dt;if(spawnTime>Math.max(3.5,7-level*.2)){spawnTime=0;addGuest()}for(const c of [...customers]){c.patience-=dt;if(c.patience<=0){customers=customers.filter(x=>x.id!==c.id);if(selected===c.id)selected=customers[0]?.id??null;miss++;combo=0;addGuest()}}for(const n of ['patty','fries','drink']){for(const s of slots(n)){if(s.mode==='idle'||s.mode==='burnt')continue;s.time+=dt;if(s.mode==='cooking'&&s.time>=duration(n)){s.mode='ready';s.time=0;beep(700);celebrate('ready')}else if(s.mode==='ready'&&s.time>=10+up[n]*1.5){s.mode='burnt';s.time=0;miss++;combo=0;beep(150)}}}render()}function shop(){const root=$('upgrades');root.innerHTML='';for(const n of types){const max=up[n]>=7,price=cost(n),el=document.createElement('div');el.className='upgrade';el.innerHTML='<b>'+({patty:'🍳',fries:'🍟',drink:'🥤',bun:'🍞'}[n])+' '+t(n)+'</b><p>Level '+(up[n]+1)+'/8'+(n==='bun'?'': ' · '+duration(n).toFixed(1)+'s')+'</p><button '+(max||coins<price?'disabled':'')+'>'+ (max?t('max'):price+' 🪙')+'</button>';el.querySelector('button').onclick=()=>{if(max||coins<price)return toast(t('notEnough'));coins-=price;up[n]++;save();beep(800);toast(t('bought'));render()};root.appendChild(el)}}function render(){document.documentElement.lang=lang;$('lang').textContent=lang==='en'?'RU':'EN';$('level').textContent='⭐ '+level;$('coins').textContent='🪙 '+coins;$('timer').textContent='⏱ '+Math.ceil(sec);$('goal').textContent=t('goal')+': '+served+'/'+goal();$('combo').textContent=combo>1?'🔥 COMBO ×'+combo:'';$('counterTitle').textContent=t('counter');$('hint').textContent=tutorialText();$('tray').innerHTML=trayView();$('serve').textContent=t('serve');$('shopButton').textContent=t('shop');$('pause').textContent=paused?t('resume'):t('pause');$('shopTitle').textContent=t('shopTitle');$('closeShop').textContent=t('close');for(const n of types){$(n+'Name').textContent=t(n);const b=document.querySelector('[data-kind="'+n+'"]'),arr=n==='bun'?[]:slots(n),ready=arr.filter(x=>x.mode==='ready').length,burnt=arr.filter(x=>x.mode==='burnt').length,cooking=arr.filter(x=>x.mode==='cooking');b.classList.toggle('ready',ready>0);b.classList.toggle('burnt',burnt>0&&!ready);$(n+'State').textContent=n==='bun'?t('add'):ready?t('ready')+' ×'+ready:burnt?t('burnt'):cooking.length?t('cooking')+' '+Math.ceil(Math.min(...cooking.map(x=>duration(n)-x.time)))+'s':t('tap');let progress=b.querySelector('.cook-progress');if(!progress&&n!=='bun'){progress=document.createElement('div');progress.className='cook-progress';b.appendChild(progress)}if(progress){const first=cooking[0];progress.style.setProperty('--pct',first?Math.min(100,first.time/duration(n)*100)+'%':ready?'100%':'0%');progress.innerHTML='<span></span><em>'+ (ready?'✓ '+ready:(cooking.length?'⏳ '+Math.max(0,Math.ceil(duration(n)-cooking[0].time))+'s':arr.length+'/'+capacity(n)))+'</em>';b.classList.toggle('cooking',cooking.length>0);b.style.setProperty('--cook-pct',first?Math.min(100,first.time/duration(n)*100)+'%':'0%')}}const root=$('customers');root.innerHTML='';for(const c of customers){const el=document.createElement('div');el.className='guest'+(selected===c.id?' active':'')+(c.patience/c.max<.3?' impatient':'');el.innerHTML='<div class="order">'+c.items.map(x=>emoji[x]).join(' ')+'</div><div class="face">'+guestArt(faces.indexOf(c.face))+'</div><div class="bar"><i style="width:'+Math.max(0,c.patience/c.max*100)+'%"></i></div><span class="guest-status">'+(c.patience/c.max<.3?(lang==='ru'?'ТОРОПИТСЯ!':'HURRY!'):'')+'</span>';el.onclick=()=>{selected=c.id;const available=items(),needed=[...c.items];if(needed.every(x=>{const i=available.indexOf(x);if(i<0)return false;available.splice(i,1);return true}))serve();else{toast(lang==='ru'?'Сначала приготовь этот заказ':'Prepare this order first');render()}};root.appendChild(el)}if(!$('shop').hidden)shop()}$('start').onclick=reset;$('serve').onclick=serve;$('pause').onclick=()=>{if(!active||!$('shop').hidden)return;paused=!paused;render()};$('shopButton').onclick=()=>{if(!active)return;paused=true;$('shop').hidden=false;render()};$('closeShop').onclick=()=>{$('shop').hidden=true;paused=false;render()};$('lang').onclick=()=>{lang=lang==='en'?'ru':'en';save();render();if(!active){$('modalTitle').textContent='Burger Boulevard 🍔';$('modalText').textContent=t('intro');$('start').textContent=t('start')}};document.querySelectorAll('[data-kind]').forEach(b=>{b.querySelector('.emoji').innerHTML=vectorArt[b.dataset.kind];b.onclick=()=>station(b.dataset.kind)});document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='1')station('patty');if(e.key==='2')station('fries');if(e.key==='3')station('drink');if(e.key==='4')station('bun');if(e.key==='Enter')serve()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){paused=true;render()}});stations={patty:{mode:'idle',time:0},fries:{mode:'idle',time:0},drink:{mode:'idle',time:0}};render();function frame(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;tick(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
